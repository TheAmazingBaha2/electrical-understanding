<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1419">
  <meta name="description" content="Electronic Learning Workbench — exam preparation, electronics courses, textbook companions, hands-on laboratories and interactive circuits.">
  <title>Electronic Learning Workbench</title>
  <link rel="icon" href="./icon.svg?v=4" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png?v=4">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" id="study-sidebar">
      <button class="sidebar-close" id="sidebar-close" aria-label="Close navigation">×</button>
      <div class="brand"><div class="brand-icon"><img src="./icon.svg?v=4" width="41" height="41" alt="Four branching lightning strikes"></div><div><b>Electronic<br>Learning<br>Workbench</b></div></div>
      <nav aria-label="Main navigation">
        <button class="nav-link active" data-view="dashboard"><span class="nav-symbol" aria-hidden="true">▦</span><span>Dashboard</span></button>
        <button class="nav-link" data-view="textbooks"><span class="nav-symbol" aria-hidden="true">▣</span><span>Textbook Companions</span><small class="nav-status" data-nav-status="textbooks"></small></button>
        <button class="nav-link" data-view="labs"><span class="nav-symbol" aria-hidden="true">⌁</span><span>Labs</span><small class="nav-status" data-nav-status="labs"></small></button>
        <button class="nav-link" data-view="ceta"><span class="nav-symbol" aria-hidden="true">◇</span><span>Exam Prep</span><small class="nav-status" data-nav-status="ceta"></small></button>
        <button class="nav-link" data-view="math"><span class="nav-symbol" aria-hidden="true">∑</span><span>Math</span><small class="nav-status" data-nav-status="math"></small></button>
        <button class="nav-link" data-view="reviews"><span class="nav-symbol" aria-hidden="true">◷</span><span>Review</span><small class="nav-status" data-nav-status="reviews"></small></button>
        <button class="nav-link" data-view="account"><span class="nav-symbol" aria-hidden="true">⚙</span><span>Account & sync</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="status-dot" id="status-dot"></span><span id="sync-status">Checking connection…</span></div>
      <div id="sidebar-resize" class="sidebar-resize" role="separator" aria-label="Resize navigation sidebar" aria-orientation="vertical" aria-valuemin="200" aria-valuemax="480" aria-valuenow="245" tabindex="0" title="Drag to resize; use arrow keys when focused"><span aria-hidden="true"></span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><button class="mobile-menu" id="menu-toggle" aria-label="Open navigation" aria-controls="study-sidebar" aria-expanded="false"><img src="./icon.svg?v=4" width="32" height="32" alt="" aria-hidden="true"></button><div><p class="eyebrow">ELECTRONICS • EXAM PREP • HANDS-ON LEARNING</p><h1 id="page-title">Your learning dashboard</h1></div></header>
      <main id="main" tabindex="-1"><noscript>Enable JavaScript to use the interactive lessons and progress tracking.</noscript></main>
      <footer>Electronic Learning Workbench · Educational circuits are for low-voltage learning only. Do not experiment with live mains.</footer>
    </div>
  </div>
  <div id="toast" aria-live="polite" role="status"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
