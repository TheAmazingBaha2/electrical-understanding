<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101B2A">
  <meta name="description" content="Electronic Learning Workbench — exam preparation, electronics courses, textbook companions, hands-on laboratories and interactive circuits.">
  <title>Electronic Learning Workbench</title>
  <link rel="icon" href="./icon.svg?v=2" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon"><img src="./icon.svg" width="41" height="41" alt="Three yellow lightning bolts"></div><div><b>Electronic<br>Learning<br>Workbench</b></div></div>
      <nav aria-label="Main navigation">
        <button class="nav-link active" data-view="dashboard"><span class="nav-symbol" aria-hidden="true">▦</span><span>Dashboard</span></button>
        <button class="nav-link" data-view="ceta"><span class="nav-symbol" aria-hidden="true">◇</span><span>Exam Practice</span></button>
        <button class="nav-link" data-view="textbooks"><span class="nav-symbol" aria-hidden="true">▣</span><span>Textbook Companions</span></button>
        <button class="nav-link" data-view="labs"><span class="nav-symbol" aria-hidden="true">⌁</span><span>Labs</span></button>
        <button class="nav-link" data-view="math"><span class="nav-symbol" aria-hidden="true">∑</span><span>Math Practice</span></button>
        <button class="nav-link" data-view="reviews"><span class="nav-symbol" aria-hidden="true">◷</span><span>Review</span></button>
        <button class="nav-link" data-view="account"><span class="nav-symbol" aria-hidden="true">⚙</span><span>Account & sync</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="status-dot" id="status-dot"></span><span id="sync-status">Checking connection…</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><button class="mobile-menu" id="menu-toggle" aria-label="Open navigation">☰</button><div><p class="eyebrow">ELECTRONICS • EXAM PREP • HANDS-ON LEARNING</p><h1 id="page-title">Your learning dashboard</h1></div><button id="account-pill" class="account-pill">Study account</button></header>
      <nav class="workspace-top-tabs" aria-label="Main study areas">
        <button class="workspace-tab active" data-view="dashboard">▦ <span>Dashboard</span></button>
        <button class="workspace-tab" data-view="ceta">◇ <span>Exam Practice</span></button>
        <button class="workspace-tab" data-view="textbooks">▤ <span>Textbook Companions</span></button>
        <button class="workspace-tab" data-view="labs">⌁ <span>Labs</span></button>
        <button class="workspace-tab" data-view="math">∑ <span>Math Practice</span></button>
        <button class="workspace-tab" data-view="reviews">◷ <span>Review</span></button>
        <button class="workspace-tab" data-view="account">⚙ <span>Account &amp; sync</span></button>
      </nav>
      <main id="main" tabindex="-1"><noscript>Enable JavaScript to use the interactive lessons and progress tracking.</noscript></main>
      <footer>Electronic Learning Workbench · Educational circuits are for low-voltage learning only. Do not experiment with live mains.</footer>
    </div>
  </div>
  <div id="toast" aria-live="polite" role="status"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
