name: Verify Electrical Understanding v2
on:
  pull_request:
  push:
    branches:
      - main
      - draft/v2-dmm-companion
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: npm run check
      - name: Run source and UI smoke tests
        run: npm test
